<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Commerce — Ops Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>⭐ Northstar Commerce</h1>
        <span id="auto-refresh" class="badge">Auto-refresh: 5s</span>
    </header>

    <div class="grid">
        <div class="card" id="card-orders">
            <h2>Orders API</h2>
            <div class="status-light" id="orders-health">●</div>
            <div class="info-row"><span>Version:</span> <span id="orders-version">—</span></div>
            <div class="info-row"><span>Hostname:</span> <span id="orders-hostname">—</span></div>
            <div class="info-row"><span>Container:</span> <span id="orders-container">—</span></div>
            <div class="info-row"><span>Kubernetes:</span> <span id="orders-k8s">—</span></div>
        </div>

        <div class="card" id="card-inventory">
            <h2>Inventory API</h2>
            <div class="status-light" id="inventory-health">●</div>
            <div class="info-row"><span>Version:</span> <span id="inventory-version">—</span></div>
            <div class="info-row"><span>Hostname:</span> <span id="inventory-hostname">—</span></div>
            <div class="info-row"><span>Faults:</span> <span id="fault-status">—</span></div>
        </div>

        <div class="card wide" id="card-metrics">
            <h2>Live Metrics</h2>
            <div class="metrics-row">
                <div class="metric">
                    <div class="metric-label">Error Rate</div>
                    <canvas id="chart-errors" width="200" height="60"></canvas>
                    <div class="metric-value" id="error-rate">0%</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Retry Count</div>
                    <canvas id="chart-retries" width="200" height="60"></canvas>
                    <div class="metric-value" id="retry-count">0</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Upstream Latency</div>
                    <canvas id="chart-latency" width="200" height="60"></canvas>
                    <div class="metric-value" id="upstream-latency">—</div>
                </div>
            </div>
        </div>

        <div class="card wide" id="card-orders-table">
            <h2>Recent Orders</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Product</th><th>Qty</th><th>Status</th><th>Time</th></tr>
                </thead>
                <tbody id="orders-tbody">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        <span id="last-updated">—</span>
    </footer>

    <script src="/static/dashboard.js"></script>
</body>
</html>
