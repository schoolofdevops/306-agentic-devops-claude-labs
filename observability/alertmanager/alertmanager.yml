global:
  resolve_timeout: 5m

route:
  receiver: file-logger
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: file-logger
      group_wait: 5s
    - match:
        severity: info
      receiver: file-logger
      repeat_interval: 4h

receivers:
  - name: file-logger
    webhook_configs:
      - url: "http://localhost:9095/webhook"
        send_resolved: true

templates: []
