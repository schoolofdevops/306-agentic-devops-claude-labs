services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 3s
      retries: 5

  inventory-api:
    build:
      context: ./app/inventory-api
    profiles: ["core", "full"]
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      APP_VERSION: "1.0.0"
      FAULT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  orders-api:
    build:
      context: ./app/orders-api
    profiles: ["core", "full"]
    ports:
      - "8080:8080"
    environment:
      INVENTORY_API_URL: "http://inventory-api:8081"
      DATABASE_URL: "postgresql+asyncpg://orders:orders@postgres:5432/orders"
      APP_VERSION: "1.0.0"
      RETRY_COUNT: "3"
      RETRY_DELAY_MS: "1000"
      TIMEOUT_MS: "5000"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observe", "full"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1d"
      - "--web.enable-lifecycle"
    depends_on:
      orders-api:
        condition: service_started
        required: false
      inventory-api:
        condition: service_started
        required: false

  alertmanager:
    image: prom/alertmanager:latest
    profiles: ["observe", "full"]
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

volumes:
  pgdata:
  prometheus-data:
