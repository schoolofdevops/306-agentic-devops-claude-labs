apiVersion: v1
kind: ResourceQuota
metadata:
  name: northstar-quota
  namespace: northstar
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
---
# Intentionally grants cluster-admin to the default service account — hardened in the M15 lab.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: northstar-admin-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: northstar
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
