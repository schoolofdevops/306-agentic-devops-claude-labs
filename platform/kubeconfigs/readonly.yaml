apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority-data: <BASE64_CA_CERT>
      server: https://127.0.0.1:6443
    name: northstar
contexts:
  - context:
      cluster: northstar
      user: readonly
      namespace: northstar
    name: northstar-readonly
current-context: northstar-readonly
users:
  - name: readonly
    user:
      token: <READONLY_TOKEN>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: northstar-readonly
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: northstar-readonly-binding
subjects:
  - kind: User
    name: readonly
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: northstar-readonly
  apiGroup: rbac.authorization.k8s.io
