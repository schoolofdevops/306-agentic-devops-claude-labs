apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority-data: <BASE64_CA_CERT>
      server: https://127.0.0.1:6443
    name: northstar
contexts:
  - context:
      cluster: northstar
      user: admin
      namespace: northstar
    name: northstar-admin
current-context: northstar-admin
users:
  - name: admin
    user:
      client-certificate-data: <BASE64_CLIENT_CERT>
      client-key-data: <BASE64_CLIENT_KEY>
