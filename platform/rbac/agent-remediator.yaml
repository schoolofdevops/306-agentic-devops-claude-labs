apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-remediator
  namespace: northstar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: northstar-agent-remediator
  namespace: northstar
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: northstar-agent-remediator
  namespace: northstar
subjects:
  - kind: ServiceAccount
    name: agent-remediator
    namespace: northstar
roleRef:
  kind: Role
  name: northstar-agent-remediator
  apiGroup: rbac.authorization.k8s.io
