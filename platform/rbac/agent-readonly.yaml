apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-readonly
  namespace: northstar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: northstar-agent-readonly
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io", "events.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: northstar-agent-readonly
subjects:
  - kind: ServiceAccount
    name: agent-readonly
    namespace: northstar
roleRef:
  kind: ClusterRole
  name: northstar-agent-readonly
  apiGroup: rbac.authorization.k8s.io
