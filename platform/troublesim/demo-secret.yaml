# Deliberately fake credential — safe to commit.
#
# This Secret exists only so the honest-limits exercise (Module 12: read-only RBAC still
# grants `get` on Secrets unless the resource list says otherwise) has something real to
# read on every learner's cluster, not just the one it was first measured on.
#
# The value below is not a real credential and never has been: `sk-demo-not-real-12345`,
# base64-encoded because that is the only encoding Kubernetes Secrets apply — it is not
# encryption, and that gap is itself part of what the lesson measures. Do not replace this
# with a real key, a real token, or anything that would be a problem to leak.
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-credentials
  namespace: northstar
type: Opaque
data:
  api_key: c2stZGVtby1ub3QtcmVhbC0xMjM0NQ==
