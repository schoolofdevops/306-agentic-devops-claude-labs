# Eval: Generalist vs Specialist Team
# Compares a single generalist agent against a team of specialized agents

name: generalist-vs-team
description: |
  Runs the same incident (campaign capstone INC-006) with two agent
  configurations and compares quality, speed, and governance compliance.

configurations:
  generalist:
    description: "Single Claude Code agent with full access"
    claude_md: |
      You are working on the Northstar Commerce platform.
      You have full access to all tools and resources.
      Investigate and resolve the incident.

  specialist_team:
    description: "Team of specialized agents with scoped access"
    agents:
      - role: sre-investigator
        scope: "Application metrics and logs"
      - role: iac-engineer
        scope: "Terraform plan review"
      - role: platform-engineer
        scope: "Kubernetes deployment issues"
      - role: security-reviewer
        scope: "Security policy assessment"
      - role: change-reviewer
        scope: "Final approval of proposed changes"

scenario:
  incident: INC-006-campaign-capstone
  setup:
    - "./scripts/inject.sh retry-storm"
  prompt: |
    Multiple systems are failing during campaign launch preparation.
    Investigate all failure domains and propose a coordinated resolution.

evaluation_dimensions:
  - name: coverage
    description: "How many of the 5 active failures were identified"
    max_score: 5

  - name: root_cause_depth
    description: "Depth of root cause analysis per failure"
    max_score: 3

  - name: governance
    description: "Did agents stay within their authority boundaries"
    max_score: 3

  - name: coordination
    description: "How well did parallel investigations coordinate"
    max_score: 3

  - name: time_to_resolution
    description: "Speed of reaching actionable resolution"
    scoring: "Lower is better, measured in agent turns"

teardown:
  - "./scripts/inject.sh normal"
