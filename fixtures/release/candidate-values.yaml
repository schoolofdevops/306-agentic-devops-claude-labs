# Release candidate v1.2.0 — the values overlay proposed for release.
#
# WHY THIS FILE EXISTS
# The chart on `main` is repaired: Module 1 pointed the readiness probe at
# /healthz, and Module 12 gave the rollout a serving floor. This overlay comes
# from a long-lived feature branch cut BEFORE those repairs. Merging it would
# silently regress both.
#
# That is the everyday case a release gate exists for. The gate does not only
# catch new bugs; it catches a stale branch reintroducing repairs the team
# already paid for. Modules 12 (Deep Dive) and 13 analyse THIS candidate, not
# `main`, so the analysis is reproducible no matter which repairs a learner has
# already merged.
#
# Two deliberate regressions:
#   1. readinessProbe.httpGet.path -> /health   (a route orders-api does not serve)
#   2. rollingUpdate.maxUnavailable -> "100%"   (no serving floor during a deploy)

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: "100%"
